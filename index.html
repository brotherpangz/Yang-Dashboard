<script>
var TPL=null,DATA=JSON.parse(document.getElementById("d").textContent),ART=null,EDIT=false,tm=null,cur=0,pic="",armed="",grp="",NONE="__none",
OPT=["Not Started","In Progress","At Risk","Blocked","Completed"],DAY=864e5,now=new Date();now.setHours(0,0,0,0);now=now.getTime();
var BASE=[["Project Initiation","Project Scope Ideation"],["Project Initiation","Project Sharing Session"],["Business Requirement","Requirement Review Internal"],["Business Requirement","Requirement Review Counterpart"],["Development / Configuration","Technical Design & Solution Alignment"],["Development / Configuration","Development API"],["Development / Configuration","Internal Testing"],["Deployment / Release","CCB / E-CCB"],["Deployment / Release","Deployment / Go-Live"],["Handover","Integration team handover"],["Handover","IT App Solution"],["Handover","Customer Handling"]];
function $(i){return document.getElementById(i)}

function fm(t){return t?new Date(t).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"2-digit"}):"-"}
function nt(ph,n){return{ph:ph,n:n||"Task baru",dl:"",pic:"",s:null,f:null,a:null,p:0,st:"Not Started",note:""}}
function chk(t){var p=t.p||0;if(t.st==="Completed"&&p<1)return"Completed tapi progress <100%";if(t.st!=="Completed"&&p>=1)return"Progress 100% tapi belum Completed";if(t.st==="Not Started"&&p>0)return"Not Started tapi progress >0%";if(t.st==="In Progress"&&p===0)return"In Progress tapi progress 0%";if(t.s&&t.f&&t.f<t.s)return"Finish sebelum Start";return""}

function save(){if(!ART)return;clearTimeout(tm);sv("Menyimpan…");tm=setTimeout(function(){try{sessionStorage.setItem("ed","1");sessionStorage.setItem("cur",cur)}catch(e){}
var dj=JSON.stringify(DATA).replace(/</g,"\\u003c"),tj=JSON.stringify(TPL).replace(/</g,"\\u003c");
var html=TPL.replace("__DA"+"TA__",function(){return dj}).replace("<!-"+"-TPL-"+"->",function(){return'<script id="tpl" type="application/json">'+tj+'<\/script>'});
ART.publish(html).catch(function(e){if(e&&e.code==="conflict")return;sv(e&&(e.code==="not_writer"||e.code==="not_granted")?"Hanya-baca":"Gagal menyimpan ("+(e&&e.code)+")")})},1200)}
function stat(p){var ts=p.tasks,n=ts.length||1,pr=ts.reduce(function(a,t){return a+t.p},0)/n,
late=ts.filter(function(t){return t.st!=="Completed"&&t.f&&T(t.f)<now}).length,
risk=ts.filter(function(t){return t.st==="At Risk"||t.st==="Blocked"}).length,
bl=ts.some(function(t){return t.st==="Blocked"}),go=T(p.go),h,c;
if(go&&go<now&&pr<1){h="Lewat target";c="bad"}else if(bl){h="Blocked";c="bad"}else if(late||risk){h="Perlu perhatian";c="wa"}else{h="On track";c="ok"}
return{pr:pr,late:late,h:h,c:c,left:go?Math.round((go-now)/DAY):null,done:ts.filter(function(t){return t.st==="Completed"}).length,n:ts.length}}
function vis(p){return!grp||(grp===NONE?!p.g:p.g===grp)}
function grps(){var s={};DATA.forEach(function(p){if(p.g)s[p.g]=1});return Object.keys(s).sort()}
function gf(){var g=grps(),n=function(f){return DATA.filter(f).length},mk=function(v,l,c){return'<button class="chip'+(grp===v?' on':'')+'" data-g="'+esc(v)+'">'+esc(l)+' <small>'+c+'</small></button>'},h="";
if(g.length){h=mk("","Semua",DATA.length)+g.map(function(x){return mk(x,x,n(function(p){return p.g===x}))}).join("");var u=n(function(p){return!p.g});if(u)h+=mk(NONE,"Tanpa grup",u);
var v=DATA.filter(vis);if(grp&&v.length)h+='<span class="gs">'+v.length+' project · rata-rata '+Math.round(v.reduce(function(a,p){return a+stat(p).pr},0)/v.length*100)+'%</span>'}
else if(EDIT)h='<span class="gs">Isi kolom "Grup / product" pada project untuk membuat filter.</span>';
$("gf").innerHTML=h}
function cards(){$("cards").innerHTML=DATA.map(function(p,i){if(!vis(p))return"";var s=stat(p);
return'<button class="card'+(i===cur?' on':'')+'" data-i="'+i+'"><h3>'+esc(p.name)+'</h3>'+(p.g?'<span class="gt">'+esc(p.g)+'</span> ':'')+'<div class="pic">PIC: '+esc(p.pic||"-")+'</div><div class="bar"><i style="width:'+Math.round(s.pr*100)+'%"></i></div>'+
'<div class="row2"><span><b>'+Math.round(s.pr*100)+'%</b> · '+s.done+'/'+s.n+' selesai</span><span class="tag '+s.c+'">'+s.h+'</span></div>'+
'<div class="row2" style="margin-top:6px"><span>Go live '+fm(T(p.go))+'</span><span>'+(s.left==null?'':(s.left>=0?s.left+' hari lagi':Math.abs(s.left)+' hari lewat'))+'</span></div>'+
(s.late?'<div class="row2 bad" style="margin-top:4px">'+s.late+' task lewat jadwal</div>':'')+'</button>'}).join("")}
function ctl(t,i){return'<div class="ed" data-i="'+i+'"><input data-k="n" class="w" value="'+esc(t.n)+'" placeholder="Nama task"><input data-k="dl" class="w" value="'+esc(t.dl)+'" placeholder="Deliverable"><input data-k="pic" value="'+esc(t.pic)+'" placeholder="PIC"><select data-k="st">'+OPT.map(function(o){return'<option'+(o===t.st?' selected':'')+'>'+o+'</option>'}).join("")+'</select><input type="number" min="0" max="100" step="5" data-k="p" value="'+Math.round(t.p*100)+'" title="Progress %"><input type="date" data-k="s" value="'+(t.s||"")+'" title="Planned Start"><input type="date" data-k="f" value="'+(t.f||"")+'" title="Planned Finish"><input type="date" data-k="a" value="'+(t.a||"")+'" title="Actual Finish"><input data-k="note" class="w" value="'+esc(t.note)+'" placeholder="Catatan"><button class="x" data-del="'+i+'">'+(armed==="t"+i?"Yakin hapus?":"Hapus task")+'</button></div>'}
function gantt(){var g=$("g");if(!DATA.length){g.className="g";g.innerHTML='<div class="ph">Belum ada project. Klik "+ Project" (mode edit) untuk menambah.</div>';return}
var p=DATA[cur],ts=p.tasks.filter(function(t){return!pic||t.pic.toUpperCase().indexOf(pic.toUpperCase())>=0}),
all=p.tasks.reduce(function(a,t){return a.concat([T(t.s),T(t.f),T(t.a)])},[T(p.go),now]).filter(Boolean),
lo=Math.min.apply(0,all)-7*DAY,hi=Math.max.apply(0,all)+7*DAY,sp=hi-lo,pc=function(t){return((t-lo)/sp*100)+"%"},w=function(a,b){return(Math.max(b-a+DAY,DAY)/sp*100)+"%"};
var h='<div class="r hd"><div>Task</div><div class="tr">',d=new Date(lo);d.setDate(1);
for(d.setMonth(d.getMonth()+1);d.getTime()<hi;d.setMonth(d.getMonth()+1))h+='<div class="m" style="left:'+pc(d.getTime())+'">'+d.toLocaleDateString("id-ID",{month:"short",year:"2-digit"})+'</div>';
h+='<div class="td" style="left:'+pc(now)+'"></div></div></div>';var last=null;
ts.forEach(function(t){if(t.ph!==last){last=t.ph;h+='<div class="ph">'+(EDIT?'<input data-ph="'+esc(t.ph)+'" value="'+esc(t.ph)+'" class="w" style="max-width:260px"> <button class="ab" data-add="'+esc(t.ph)+'">+ Task</button>':esc(t.ph))+'</div>'}
var s=T(t.s),f=T(t.f),a=T(t.a),b="";
if(s&&f){b+='<div class="b" style="left:'+pc(s)+';width:'+w(s,f)+';background:var(--bl)"></div>';
if(t.p>0)b+='<div class="b" style="left:'+pc(s)+';width:'+(Math.max(f-s+DAY,DAY)/sp*100*t.p)+'%;background:var(--gr)"></div>';
if(a&&a>f)b+='<div class="b" style="left:'+pc(f+DAY)+';width:'+w(f+DAY,a)+';background:var(--am);opacity:.9"></div>';
else if(!a&&t.st!=="Completed"&&f<now)b+='<div class="b" style="left:'+pc(f+DAY)+';width:'+w(f+DAY,now)+';background:var(--rd)"></div>'}
var i=p.tasks.indexOf(t);
h+='<div class="r" title="'+esc(t.note||t.dl)+'"><div>'+(EDIT?ctl(t,i):esc(t.n)+'<small>'+esc(t.pic)+' · <span class="st">'+t.st+' '+Math.round(t.p*100)+'%</span>'+(s&&f?' · '+fm(s)+' – '+fm(f):' · jadwal belum diisi')+'</small>')+(chk(t)?'<span class="chk">⚠ '+chk(t)+'</span>':'')+'</div><div class="tr">'+b+'<div class="td" style="left:'+pc(now)+'"></div></div></div>'});
if(EDIT)h+='<div class="ph"><input id="np" class="w" placeholder="Nama phase baru" style="max-width:260px"> <button class="ab" data-addph="1">+ Phase</button></div>';
g.className="g"+(EDIT?" ge":"");g.innerHTML=h}
